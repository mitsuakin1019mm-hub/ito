<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>itoモチーフゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EEE1;
    --card:#FBF7EC;
    --ink:#26221B;
    --navy:#2C4A5E;
    --thread:#B7392F;
    --gold:#B8912C;
    --line:rgba(38,34,27,0.12);
    --shadow: 0 10px 30px rgba(38,34,27,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(183,57,47,0.06), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(44,74,94,0.07), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .stage{
    width:100%;
    max-width:460px;
  }
  .card{
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:32px 24px;
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(38,34,27,0.015) 0px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(38,34,27,0.015) 0px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--thread);
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .eyebrow::before{
    content:"";
    width:16px;height:1px;
    background:var(--thread);
    display:inline-block;
  }
  h1,h2{
    font-family:'Zen Old Mincho', serif;
    margin:0 0 4px 0;
    line-height:1.4;
  }
  h1{font-size:26px;}
  h2{font-size:22px;}
  p.sub{
    color:#5b5347;
    font-size:14px;
    margin:0 0 24px 0;
    line-height:1.7;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    color:#5b5347;
    margin-bottom:6px;
    font-weight:500;
  }
  input[type=number], input[type=text]{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    font-family:inherit;
    font-size:16px;
    color:var(--ink);
  }
  input:focus{outline:2px solid var(--navy); outline-offset:1px;}
  .btn{
    width:100%;
    padding:15px 18px;
    border-radius:12px;
    border:none;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-thread{background:var(--thread); color:#fff;}
  .btn-ghost{background:transparent; color:var(--navy); border:1px solid var(--navy);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .stack > * + *{margin-top:12px;}
  .player-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .player-num{
    width:24px;height:24px;
    border-radius:50%;
    background:var(--navy);
    color:#fff;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .center{text-align:center;}
  .topic-axis{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 0 6px 0;
    position:relative;
  }
  .topic-axis .end{
    font-size:14px;
    font-weight:700;
    color:var(--navy);
    max-width:38%;
    line-height:1.5;
  }
  .topic-axis .end.high{color:var(--thread); text-align:right;}
  .topic-theme{
    font-family:'Zen Old Mincho', serif;
    font-size:24px;
    text-align:center;
    margin:8px 0 22px 0;
    line-height:1.5;
  }
  svg.axisline{display:block; width:100%; height:14px; margin-bottom:4px;}
  .topic-change-link{
    text-align:center;
    font-size:12px;
    color:#948a78;
    margin-top:14px;
    cursor:pointer;
    text-decoration:underline;
  }
  .pass-name{
    font-family:'Zen Old Mincho', serif;
    font-size:24px;
    text-align:center;
    margin:6px 0 28px 0;
  }
  .number-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 0;
  }
  .number-circle{
    width:150px;height:150px;
    border-radius:50%;
    background:#fff;
    border:2px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Zen Old Mincho', serif;
    font-size:56px;
    color:var(--thread);
    box-shadow:inset 0 0 0 6px var(--paper);
  }
  .tap-circle{
    width:150px;height:150px;
    border-radius:50%;
    border:2px dashed var(--navy);
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
    color:var(--navy);
    cursor:pointer;
    text-align:center;
    padding:10px;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  .memo-note{
    text-align:center;
    font-size:13px;
    color:#5b5347;
    margin:16px 0 22px 0;
    background:rgba(184,145,44,0.12);
    border:1px solid rgba(184,145,44,0.3);
    padding:10px 12px;
    border-radius:10px;
  }
  .timer{
    font-family:'Zen Old Mincho', serif;
    font-size:44px;
    text-align:center;
    margin:26px 0;
    color:var(--navy);
    letter-spacing:0.04em;
  }
  .pulse{
    width:10px;height:10px;
    border-radius:50%;
    background:var(--thread);
    display:inline-block;
    margin-right:8px;
    animation:pulse 1.4s ease-in-out infinite;
    vertical-align:middle;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.35; transform:scale(0.7);}
  }
  .vote-btn{
    width:100%;
    text-align:left;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .vote-btn:active{background:var(--paper);}
  .score-list{margin:18px 0;}
  .score-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .score-row:last-child{border-bottom:none;}
  .score-row .pts{
    font-family:'Zen Old Mincho', serif;
    font-size:16px;
    color:var(--thread);
  }
  .winner-badge{
    display:inline-block;
    background:var(--gold);
    color:#fff;
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:100px;
    margin-left:8px;
  }
  .crown{
    text-align:center;
    font-size:40px;
    margin-bottom:6px;
  }
  .footer-note{
    text-align:center;
    font-size:11px;
    color:#948a78;
    margin-top:18px;
  }
  .setup-links{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:18px;
  }
  .setup-link{
    text-align:center;
    font-size:12px;
    color:#948a78;
    cursor:pointer;
    text-decoration:underline;
  }
  .howto-steps{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .howto-step{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .howto-num{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--navy);
    color:#fff;
    font-family:'Zen Old Mincho', serif;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    margin-top:2px;
  }
  .howto-body{
    font-size:13px;
    line-height:1.7;
    color:var(--ink);
  }
  .howto-body b{
    font-family:'Zen Old Mincho', serif;
    font-size:15px;
  }
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(38,34,27,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-box{
    background:var(--card);
    border-radius:16px;
    padding:24px;
    max-width:340px;
    width:100%;
    box-shadow:var(--shadow);
  }
  .modal-title{
    font-family:'Zen Old Mincho', serif;
    font-size:18px;
    margin-bottom:14px;
  }
  .modal-message{
    font-size:14px;
    line-height:1.7;
    margin-bottom:20px;
  }
  .modal-input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    font-family:inherit;
    font-size:16px;
    margin-bottom:16px;
  }
  .modal-actions{
    display:flex;
    gap:10px;
  }
  .modal-btn{
    flex:1;
    width:auto;
    text-align:center;
  }
  .topic-checklist{
    max-height:340px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
  }
  .topic-row{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
  }
  .topic-row:last-child{border-bottom:none;}
  .topic-row-main{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .topic-row input[type=checkbox]{
    width:18px;height:18px;
    flex-shrink:0;
    accent-color:var(--navy);
  }
  .topic-text{
    flex:1;
    font-size:14px;
    line-height:1.5;
  }
  .topic-axis-edit{
    display:flex;
    align-items:center;
    gap:6px;
    margin:8px 0 0 28px;
  }
  .topic-axis-edit input{
    flex:1;
    min-width:0;
    font-size:12px;
    padding:6px 8px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
  }
  .axis-num{
    font-size:11px;
    color:#948a78;
    flex-shrink:0;
  }
  .axis-arrow{
    font-size:11px;
    color:#948a78;
    flex-shrink:0;
  }
  .topic-del{
    color:var(--thread);
    font-size:14px;
    padding:2px 6px;
    flex-shrink:0;
    cursor:pointer;
  }
  .round-badge{
    position:absolute;
    top:20px; right:20px;
    font-size:11px;
    color:#948a78;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
</style>
</head>

function el(html){

/* ---------- 共通モーダル(window.prompt/alert/confirmはサンドボックス環境でブロックされることがあるため自前実装) ---------- */
function showAlertModal(message){
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <div class="modal-message">${message}</div>
        <div class="modal-actions">
          <div class="btn btn-primary modal-btn" id="modalAlertOk">OK</div>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector('#modalAlertOk').addEventListener('click', ()=>overlay.remove());
}

function showConfirmModal(message, onConfirm, okLabel){
  const label = okLabel || "OK";
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <div class="modal-message">${message}</div>
        <div class="modal-actions">
          <div class="btn btn-ghost modal-btn" id="modalConfirmCancel">キャンセル</div>
          <div class="btn btn-thread modal-btn" id="modalConfirmOk">${label}</div>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.querySelector('#modalConfirmCancel').addEventListener('click', close);
  overlay.querySelector('#modalConfirmOk').addEventListener('click', ()=>{
    close();
    onConfirm();
  });
}

/* ---------- 2. お題表示 ---------- */
function activeTopics(){
  return topicPool.filter(t=>t.enabled);
}

function pickTopic(){
  const active = activeTopics();
  if(active.length === 0){
    return {id:null, text:"(有効なお題がありません。お題の設定で追加してください)"};
  }
  if(state.usedTopics.size >= active.length){
    state.usedTopics = new Set();
  }
  let candidate;
  do{
    candidate = active[Math.floor(Math.random()*active.length)];
  }while(state.usedTopics.has(candidate.id));
  state.usedTopics.add(candidate.id);
  return candidate;
}

function goToTopic(){
  state.round += 1;
  state.currentTopic = pickTopic();
  state.screen = 'topic';
  render();
}

function renderTopic(app){
  const t = state.currentTopic;
  const lowLabel = t.low || "当てはまらない";
  const highLabel = t.high || "誰もが納得";
  const card = el(`

  app.appendChild(card);
  card.querySelector('#goDistribute').addEventListener('click', ()=>{
    state.order = state.players.map(p=>p.id); // 登録順で固定
    state.distributeIndex = 0;
    state.revealStage = 'ask';

    showConfirmModal("本当にこのお題を変更しますか?", ()=>{

  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ---------- 3. 数字割り振り ---------- */
function assignedNumbersSet(){
  return new Set(Object.values(state.currentNumbers));
}

function drawUniqueNumber(){
  const used = assignedNumbersSet();
  let n;
  do{
    n = 1 + Math.floor(Math.random()*100);
  }while(used.has(n));
  return n;
}

function renderDistribute(app){
  const pid = state.order[state.distributeIndex];
  const player = state.players.find(p=>p.id===pid);

  if(state.revealStage === 'ask'){
    const card = el(`
      <div class="card">
        <div class="eyebrow">NUMBER ${state.distributeIndex+1} / ${state.order.length}</div>
        <p class="sub" style="margin-bottom:2px;">この端末を渡してください</p>
        <div class="pass-name">${player.name} さんへ</div>
        <div class="number-wrap">
          <div class="tap-circle" id="revealBtn">タップして<br>番号を表示</div>
        </div>
        <p class="footer-note">周りの人には見えないようにしてね</p>
      </div>
    `);
    app.appendChild(card);
    card.querySelector('#revealBtn').addEventListener('click', ()=>{
      state.currentNumbers[pid] = drawUniqueNumber();
      state.revealStage = 'revealed';
      render();
    });
  } else if(state.revealStage === 'revealed'){
    const num = state.currentNumbers[pid];
    const card = el(`
      <div class="card">
        <div class="eyebrow">${player.name} さんの番号</div>
        <div class="number-wrap">
          <div class="number-circle">${num}</div>
        </div>
        <div class="memo-note">この数字を手元のカードにメモしてね(画面には残しません)</div>
        <div class="btn btn-primary" id="memoedBtn">メモした!</div>
      </div>
    `);
    app.appendChild(card);
    card.querySelector('#memoedBtn').addEventListener('click', ()=>{
      const next = state.distributeIndex + 1;
      if(next >= state.order.length){
        startThinking();
      } else {
        state.distributeIndex = next;
        state.revealStage = 'ask';
        render();
      }
    });
  }
}

/* ---------- 4. シンキングタイム ---------- */
function startThinking(){
  state.screen = 'thinking';
  state.timerStart = Date.now();
  state.timerText = '00:00';
  render();
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(()=>{
    const secs = Math.floor((Date.now()-state.timerStart)/1000);
    const m = String(Math.floor(secs/60)).padStart(2,'0');
    const s = String(secs%60).padStart(2,'0');
    const timerEl = document.getElementById('timerText');
    if(timerEl) timerEl.textContent = `${m}:${s}`;
    else clearInterval(state.timerHandle);
  }, 1000);
}

/* ---------- 6. ラウンド終了 ---------- */
function renderRoundEnd(app){
  const sorted = [...state.players].sort((a,b)=>b.score-a.score);
  const rowsHtml = sorted.map(p=>`
    <div class="score-row">
      <span>${p.name}${p.name===state.lastFinePlay ? '<span class="winner-badge">FINE PLAY</span>' : ''}</span>
      <span class="pts">${p.score}pt</span>
    </div>
  `).join('');

  const card = el(`
    <div class="card">
      <div class="eyebrow">ROUND ${state.round} 終了</div>
      <h2>🎉 ${state.lastFinePlay} さんにファインプレー賞!</h2>
      <div class="score-list">${rowsHtml}</div>
      <div class="stack">
        <div class="btn btn-primary" id="nextRoundBtn">次のゲームへ</div>
        <div class="btn btn-ghost" id="finishBtn">ゲームを終了する</div>
      </div>
    </div>
  `);
  app.appendChild(card);
  card.querySelector('#nextRoundBtn').addEventListener('click', goToTopic);
  card.querySelector('#finishBtn').addEventListener('click', ()=>{
    state.screen = 'final';
    render();
  });
}

/* ---------- 7. 最終結果 ---------- */
function renderFinal(app){
  const sorted = [...state.players].sort((a,b)=>b.score-a.score);
  const top = sorted[0].score;
  const winners = sorted.filter(p=>p.score===top).map(p=>p.name);
  const winnerText = winners.length > 1
    ? `${winners.join(' さん・')} さんが同率1位!`
    : `${winners[0]} さんが優勝!`;

  const rowsHtml = sorted.map(p=>`
    <div class="score-row">
      <span>${p.name}${winners.includes(p.name) ? '<span class="winner-badge">WINNER</span>' : ''}</span>
      <span class="pts">${p.score}pt</span>
    </div>
  `).join('');

  const card = el(`
    <div class="card">
      <div class="eyebrow">FINAL RESULT</div>
      <div class="crown">🏆</div>
      <h2 class="center">${winnerText}</h2>
      <p class="sub center">全${state.round}ラウンド、おつかれさまでした</p>
      <div class="score-list">${rowsHtml}</div>
      <div class="btn btn-primary" id="restartBtn">もう一度さいしょから</div>
    </div>
  `);
  app.appendChild(card);
  card.querySelector('#restartBtn').addEventListener('click', ()=>{
    state = freshState();
    render();
  });
}

        <button class="btn btn-primary" id="addTopicBtn" style="margin-top:8px;">追加</button>
      </div>
      <div id="topicChecklist" class="topic-checklist"></div>
      <div class="stack" style="margin-top:20px;">
        <div class="btn btn-ghost" id="exportBtn">お題設定をJSONで書き出す</div>
        <label class="btn btn-ghost" id="importLabel" style="display:block; text-align:center; cursor:pointer;">
          お題設定をJSONから読み込む
          <input type="file" id="importInput" accept="application/json" style="display:none;">
        </label>
        <div class="btn btn-primary" id="backBtn">セットアップに戻る</div>
      </div>
    </div>
  `);
  app.appendChild(card);

  const list = card.querySelector('#topicChecklist');
  function renderList(){
    list.innerHTML = '';
    topicPool.forEach(t=>{
      const row = el(`
        <div class="topic-row">
          <div class="topic-row-main">
            <input type="checkbox" class="topic-check" data-id="${t.id}" ${t.enabled ? 'checked' : ''}>
            <span class="topic-text">${t.text}</span>
            ${t.custom ? `<span class="topic-del" data-id="${t.id}">✕</span>` : ''}
          </div>
          <div class="topic-axis-edit">
            <span class="axis-num">1</span>
            <input type="text" class="axis-low" data-id="${t.id}" value="${t.low || ''}" placeholder="ラベル(任意)">
            <span class="axis-arrow">→</span>
            <input type="text" class="axis-high" data-id="${t.id}" value="${t.high || ''}" placeholder="ラベル(任意)">
            <span class="axis-num">100</span>
          </div>
        </div>
      `);
      list.appendChild(row);
    });
    list.querySelectorAll('.topic-check').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const topic = topicPool.find(x=>x.id===cb.dataset.id);
        if(topic) topic.enabled = cb.checked;
        render();
      });
    });
    list.querySelectorAll('.axis-low').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const topic = topicPool.find(x=>x.id===inp.dataset.id);
        if(topic) topic.low = inp.value.trim();
      });
    });
    list.querySelectorAll('.axis-high').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const topic = topicPool.find(x=>x.id===inp.dataset.id);
        if(topic) topic.high = inp.value.trim();
      });
    });
    list.querySelectorAll('.topic-del').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        showConfirmModal("このお題を削除しますか?", ()=>{
          topicPool = topicPool.filter(x=>x.id !== btn.dataset.id);
          render();
        }, "削除する");
      });
    });
  }
  renderList();

  card.querySelector('#addTopicBtn').addEventListener('click', ()=>{
    const input = card.querySelector('#newTopicInput');
    const lowInput = card.querySelector('#newTopicLow');
    const highInput = card.querySelector('#newTopicHigh');
    const text = input.value.trim();
    if(!text) return;
    const low = lowInput.value.trim();
    const high = highInput.value.trim();
    const newTopic = {id:'custom-'+Date.now(), text, enabled:true, custom:true};
    if(low && high){ newTopic.low = low; newTopic.high = high; }
    topicPool.push(newTopic);
    render();
  });

  card.querySelector('#exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(topicPool, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ito-topics.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  card.querySelector('#importInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(Array.isArray(parsed)){
          topicPool = parsed;
          render();
        } else {
          showAlertModal("ファイルの形式が正しくありません");
        }
      }catch(err){
        showAlertModal("読み込みに失敗しました:" + err.message);
      }
    };
    reader.readAsText(file);
  });

  card.querySelector('#backBtn').addEventListener('click', ()=>{
    state.screen = 'setup';
    render();
  });
}

render();
</script>
</body>
</html>
